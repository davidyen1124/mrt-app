name: Refresh station data

# Pulls the Bus+ station feed weekly. When stations, timetables or fares change, the snapshot in data/
# is committed to main and redeployed (the deploy job runs the worker tests first).
on:
  schedule:
    - cron: '17 19 * * 0' # Mondays 03:17 Asia/Taipei
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild snapshot from Bus+
        run: node scripts/refresh-stations.mjs

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh taipei stations from bus+"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
